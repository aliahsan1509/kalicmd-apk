name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  P4A_PREREQUISITES_INSTALL_INTERACTIVE: "0"
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev autopoint gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install buildozer
          python -m pip install "cython==0.29.34"

      - name: Verify project
        run: |
          test -f main.py
          test -f buildozer.spec
          test -f tools_data.py
          test -f concepts_data.py
          test -f labs_data.py
          test -f missions_data.py
          echo "Project files found."
          python --version
          java -version
          buildozer --version

      - name: Build debug APK
        run: buildozer android debug

      - name: Show APK
        run: |
          ls -lah bin/
          find bin -maxdepth 1 -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kalicmd-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
