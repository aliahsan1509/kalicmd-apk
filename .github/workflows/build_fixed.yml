name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             git zip unzip             autoconf automake libtool libltdl-dev             pkg-config cmake             zlib1g-dev libncurses5-dev libncursesw5-dev             libffi-dev libssl-dev             openjdk-17-jdk

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer "cython<3"

      - name: Prepare Android build configuration
        run: |
          python -m buildozer --version
          java -version
          python -m buildozer android p4a -- --help

      - name: Build debug APK
        env:
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        run: |
          python -m buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kalicmd-apk
          path: |
            bin/*.apk
          if-no-files-found: error
          retention-days: 30
